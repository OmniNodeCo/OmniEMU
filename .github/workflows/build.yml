name: Build OmniEMU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            artifact: windows

          - name: macOS ARM64
            runner: macos-15
            artifact: macos-arm64

          - name: Linux
            runner: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify macOS ARM architecture
        if: matrix.artifact == 'macos-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          echo "Building on Apple Silicon ($(uname -m))"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: omniemu-${{ matrix.artifact }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
