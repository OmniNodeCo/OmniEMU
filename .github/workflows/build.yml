name: Build OmniEMU Native Emulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            runtime: win-x64
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            runtime: osx-arm64
            artifact: macos-arm64
          - name: Linux x64
            runner: ubuntu-latest
            runtime: linux-x64
            artifact: linux-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify Apple Silicon runner
        if: matrix.runtime == 'osx-arm64'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Restore emulator dependencies
        run: dotnet restore Ryujinx.sln --runtime ${{ matrix.runtime }}

      - name: Publish native emulator
        run: >-
          dotnet publish src/Ryujinx/Ryujinx.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          --output publish/${{ matrix.artifact }}
          -p:Version=0.1.${{ github.run_number }}

      - name: Include attribution and legal notices
        shell: bash
        run: |
          cp LICENSE.txt publish/${{ matrix.artifact }}/LICENSE.txt
          cp UPSTREAM.md publish/${{ matrix.artifact }}/UPSTREAM.md
          cp distribution/legal/THIRDPARTY.md publish/${{ matrix.artifact }}/THIRDPARTY.md

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: omniemu-${{ matrix.artifact }}-${{ github.sha }}
          path: publish/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
